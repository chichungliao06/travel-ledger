<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>旅途記帳本</title>
<meta name="theme-color" content="#2a4a94">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅途記帳本">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* 單欄手機 App（最寬 520px）、置頂旅程列、底部分頁、全螢幕記帳表單。靛藍墨色配冷灰紙色，紅色只用在需要注意的地方 */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f5f7fb; --ink:#18202e; --muted:#5b6578; --line:#d8dee8;
  --accent:#2a4a94; --accent-soft:#e2e8f6; --accent-ink:#ffffff;
  --seal:#c2412c; --seal-soft:#fbe8e3; --good:#25734f; --good-soft:#e0f1e8; --warn:#9a6a00; --warn-soft:#fbf1d9;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --f-num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f131b; --surface:#171d28; --surface-2:#1d2431; --ink:#e6eaf2; --muted:#98a2b5; --line:#2a3242;
  --accent:#8aa5f2; --accent-soft:#232f4b; --accent-ink:#0d1220;
  --seal:#f07c66; --seal-soft:#3a211d; --good:#5fc49c; --good-soft:#18352a; --warn:#e6b54a; --warn-soft:#3a2f14; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;max-width:100%;margin:0;overflow-x:hidden;overflow-x:clip;overscroll-behavior-x:none}
html{touch-action:pan-y;-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#app,main,section,.field,.panel,.list,.row2>*,.sh-in{min-width:0}
#app{max-width:520px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.trip{font-size:19px;font-weight:700;text-wrap:balance}
.who{font-size:13px;color:var(--muted)}
.status{font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.status.off i{background:var(--muted)} .status.wait i{background:var(--warn)} .status.err i{background:var(--seal)}
main{display:flex;flex-direction:column;gap:22px}
.h{font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:0 0 8px}
.h-row{display:flex;justify-content:space-between;align-items:baseline}
.link{background:none;border:0;color:var(--accent);font-size:14px;padding:4px}
a.link{text-decoration:none;font-weight:600}
.summary{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.summary .lbl{font-size:12px;opacity:.8;letter-spacing:.05em}
.big{font-size:32px;font-weight:700;line-height:1.15}
.summary .sub{font-size:12px;opacity:.85}
.sum-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sum-row>*{background:color-mix(in srgb,var(--accent-ink) 12%,transparent);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;border:0;color:inherit;text-align:left}
.mid{font-size:17px;font-weight:700}
.pend.on{background:var(--seal);color:#fff}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 10px;font-weight:700;font-size:16px}
.qbtn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-size:14px;line-height:1.2;max-width:100%;overflow-wrap:anywhere}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.sm{padding:6px 11px;font-size:13px}
.list{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px}
.row:last-child{border-bottom:0}
.ric{font-size:22px;text-align:center}
.rmid{display:flex;flex-direction:column;min-width:0}
.rt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs{font-size:12px;color:var(--muted)}
.ramt{display:flex;flex-direction:column;align-items:flex-end;font-weight:700}
.tag{font-style:normal;font-size:11px;font-weight:600;margin-left:6px;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted);vertical-align:2px;white-space:nowrap}
.tag.warn{background:var(--seal-soft);color:var(--seal)}
.tag.up{background:var(--warn-soft);color:var(--warn)}
.day{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:14px 2px 6px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.note{font-size:13px;color:var(--muted)}
.alert{background:var(--seal-soft);color:var(--seal);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.okay{background:var(--good-soft);color:var(--good);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.info{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 12px;font-size:14px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.pos{color:var(--good)} .neg{color:var(--seal)}
.xfer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.xfer:last-child{border-bottom:0}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.hot>i{background:var(--seal)}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px;flex-wrap:wrap}
.kv b{color:var(--ink)}
.owner{font-size:15px;font-weight:700;margin:4px 0 -2px}
.field{display:flex;flex-direction:column;gap:6px}
.inp{width:100%;min-width:0;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-size:16px}
input[type="date"].inp{-webkit-appearance:none;appearance:none;display:block;min-height:46px}
select.inp{-webkit-appearance:none;appearance:none;text-align:center;font-family:var(--f-num);font-size:18px;padding:10px 6px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--seal);color:#fff}
.btn:disabled{opacity:.45}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2>*{flex:1 1 0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:520px;margin:0 auto;display:flex}
.tabs button{flex:1;background:none;border:0;padding:10px 4px;font-size:13px;color:var(--muted);font-weight:600;border-radius:10px}
.tabs button.on{color:var(--accent);background:var(--accent-soft)}
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.sh-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-bottom:16px}
.sh-top{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding-block:12px}
.sh-top h2{font-size:17px;margin:0}
.amtbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.amtline{display:flex;align-items:center;gap:8px}
.amt{flex:1;min-width:0;border:0;background:none;font-family:var(--f-num);font-size:34px;font-weight:700;padding:0;outline:none}
.amt::placeholder{color:var(--line)}
.cur{display:flex;gap:4px}
.unc{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:6px 10px;border-radius:99px;border:1px solid var(--line);white-space:nowrap;user-select:none;-webkit-user-select:none}
.unc input{width:18px;height:18px;accent-color:var(--seal);margin:0}
.unc.on{background:var(--seal-soft);color:var(--seal);border-color:var(--seal)}
.unc.plain.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.unc.plain input{accent-color:var(--accent)}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:600}
.cat span{font-size:22px}
.cat.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 2px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.rec{font-size:13px;padding:8px 10px;border-radius:10px;background:var(--good-soft);color:var(--good)}
.cust{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,140px);gap:8px;align-items:center}
.cust .inp{font-family:var(--f-num);text-align:right;padding:8px 10px}
.remain{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.remain.bad{background:var(--seal-soft);color:var(--seal);font-weight:700}
.remain.good{background:var(--good-soft);color:var(--good);font-weight:700}
.dt{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:8px;align-items:end}
.tm{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:4px;align-items:center}
.tm b{font-family:var(--f-num);font-size:18px}
.photo{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.photo img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.filebtn{display:inline-flex;align-items:center;justify-content:center;border:1px dashed var(--muted);border-radius:12px;padding:12px 14px;font-weight:600;color:var(--muted);background:var(--surface)}
.sh-foot{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line)}
.hint{font-size:13px;color:var(--seal);min-height:1.2em;text-align:center}
.log{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.receipt{background:var(--surface);border-radius:6px;padding:14px 14px 10px;position:relative;font-size:13px;border:1px solid var(--line);box-shadow:0 2px 0 var(--line)}
.receipt::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;border-bottom:2px dashed var(--line)}
.receipt .store{font-weight:700;font-size:15px}
.receipt .jp{color:var(--muted);font-size:12px}
.rline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:5px 0;border-bottom:1px dotted var(--line)}
.rline:last-of-type{border-bottom:0}
.rtotal{display:flex;justify-content:space-between;font-weight:700;font-size:16px;padding-top:8px;border-top:1px solid var(--ink);margin-top:4px}
.scan{height:120px;border-radius:8px;background:linear-gradient(90deg,var(--surface-2) 25%,var(--accent-soft) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:sh 1.1s linear infinite;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:600}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){.scan{animation:none}}
.viewer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.viewer img{max-height:100%;object-fit:contain;border-radius:6px}
.login{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;
  padding:calc(40px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.login-in{max-width:400px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.brand{font-size:28px;font-weight:800;letter-spacing:.02em}
.who-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.who-grid button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;font-weight:700;font-size:16px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:6px}
.pin{font-family:var(--f-num);font-size:26px;letter-spacing:.5em;text-align:center}
.toast{position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;top:calc(12px + env(safe-area-inset-top,0px));z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:18px;font-size:14px;font-weight:600;max-width:488px;text-align:center}
.memrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dotted var(--line)}
.memrow:last-child{border-bottom:0}
.xbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px;color:var(--seal)}
.xbtn:disabled{color:var(--muted);opacity:.7}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite;vertical-align:-2px}
@keyframes rot{to{transform:rotate(1turn)}}
</style>
</head>
<body>
<div id="app" hidden>
  <header class="top">
    <div style="min-width:0"><div class="trip" id="tripName"></div><div class="who" id="whoLine"></div></div>
    <button class="status" id="status" data-act="sync-now"><i></i><span></span></button>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" id="tabs" hidden><div class="tabs-in" id="tabsIn"></div></nav>
<div id="login" class="login" hidden></div>
<section id="sheet" class="sheet" hidden></section>
<div id="viewer" class="viewer" hidden data-act="close-viewer"></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="ocrFile" accept="image/*" hidden>
<input type="file" id="photoFile" accept="image/*" hidden>

<script>
'use strict';
/* ===== 設定 ===== */
const API = 'https://script.google.com/macros/s/AKfycbyO9KSUqwLD1rcg4puUQQRIkYBJr52Np5U8CmDv6ipuSL6JLhefoAZBXOS1xmF9bLeP/exec';
const APP_VERSION = '1.1.1';
const SYNC_MS = 30000;

/* ===== 本機儲存 ===== */
const store = {
  get(k, d) { try { const v = localStorage.getItem('tl.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('tl.' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('tl.' + k); } catch (e) {} },
};
const mem = {};   // IndexedDB 不能用時的備援
const idb = {
  p: null,
  open() {
    if (!this.p) this.p = new Promise((res, rej) => {
      const r = indexedDB.open('travel-ledger', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('photos');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this.p;
  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => { const t = db.transaction('photos', mode); const q = fn(t.objectStore('photos')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); });
  },
  async put(k, v) { try { await this.tx('readwrite', s => s.put(v, k)); } catch (e) { mem[k] = v; } },
  async get(k) { try { const v = await this.tx('readonly', s => s.get(k)); return v != null ? v : mem[k]; } catch (e) { return mem[k]; } },
  async del(k) { delete mem[k]; try { await this.tx('readwrite', s => s.delete(k)); } catch (e) {} },
};

let auth = store.get('auth', null);         // {token, me, unlocked}
let D = store.get('data', null);            // {trip, members, categories, templates, cards, records:{id:rec}}
let outbox = store.get('outbox', []);       // 待上傳的動作
let lastSync = store.get('lastSync', 0);
let net = { state: 'idle', msg: '' };       // idle | syncing | offline | error
let tab = 'home', listFilter = 'all', F = null, C = null, memDel = null, cardDel = null, exportRes = null, busy = {};
const saveData = () => store.set('data', D), saveOutbox = () => store.set('outbox', outbox);

/* ===== 小工具 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const SYM = { JPY: '¥', TWD: 'NT$', KRW: '₩', USD: 'US$', EUR: '€', THB: '฿', CNY: '¥', HKD: 'HK$', SGD: 'S$', GBP: '£' };
const sym = c => SYM[c] || (c + ' ');
const fmt = (n, c) => sym(c) + Math.round(n).toLocaleString('en-US');
const num = v => { const x = parseFloat(String(v == null ? '' : v).replace(/,/g, '')); return isFinite(x) ? x : 0; };
const pad = n => String(n).padStart(2, '0');
const now = () => new Date();
const today = () => { const d = now(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const nowHM = () => { const d = now(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dayLbl = s => { const d = new Date(s + 'T00:00'); return isNaN(d) ? s : (d.getMonth() + 1) + '/' + d.getDate() + '（' + '日一二三四五六'[d.getDay()] + '）'; };
const newId = () => 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const member = id => (D.members.find(m => m.id === id) || { name: '（已移除）' });
const active = () => D.members.filter(m => m.active !== false);
const isAdmin = id => !!member(id).admin;
const cat = k => D.categories.find(c => c.cat === k) || D.categories[D.categories.length - 1] || { cat: k, icon: '📦', subs: [] };
const toTWD = (a, c) => c === 'TWD' ? a : a * D.trip.rate;
const toBase = (a, c) => c === 'TWD' ? a / D.trip.rate : a;
const isPending = r => r.uncertain || r.cat === '未分類' || !r.item || r.item === '待補';
const recs = () => Object.values(D.records);
const sortKey = r => r.date + ' ' + (r.time || '99:99');
const sorted = () => recs().sort((a, b) => sortKey(b) < sortKey(a) ? -1 : sortKey(b) > sortKey(a) ? 1 : (b.createdAt || 0) - (a.createdAt || 0));
let tt; function toast(m, ms) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, ms || 2600); }

/* ===== 後端 API ===== */
async function api(action, body, ms) {
  const ac = new AbortController(), timer = setTimeout(() => ac.abort(), ms || 25000);
  let j;
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ action: action, token: auth && auth.token }, body || {})), signal: ac.signal, redirect: 'follow' });
    j = await r.json();
  } catch (e) { const x = new Error('連不上伺服器'); x.code = 'NETWORK'; throw x; }
  finally { clearTimeout(timer); }
  if (!j.ok) {
    const e = new Error(j.message || j.error); e.code = j.error;
    if (e.code === 'AUTH') { onAuthLost(e.message); }
    throw e;
  }
  return j;
}
const RETRY = { NETWORK: 1, SERVER_ERROR: 1, OCR_RATE_LIMIT: 1 };

function onAuthLost(msg) {
  auth = null; store.del('auth');
  toast(msg || '請重新登入', 4000);
  showLogin();
}

/* ===== 同步與離線佇列 ===== */
function applyServerRecord(r) {
  if (r.deleted) { delete D.records[r.id]; return; }
  if (outbox.some(o => o.id === r.id)) return;   // 本機還有沒上傳的修改，先保留本機版本
  const cur = D.records[r.id];
  if (!cur || !cur.rev || cur.rev <= r.rev || cur._err) D.records[r.id] = r;
}

async function bootstrap() {
  const j = await api('bootstrap');
  const keepLocal = {};
  outbox.forEach(o => { if (D && D.records[o.id]) keepLocal[o.id] = D.records[o.id]; });
  const failed = D ? recs().filter(r => r._err && !r.rev) : [];
  D = { trip: j.trip, members: j.members, categories: j.categories, templates: j.templates, cards: j.cards, records: {} };
  j.records.forEach(r => { D.records[r.id] = r; });
  Object.assign(D.records, keepLocal);
  failed.forEach(r => { D.records[r.id] = r; });
  auth.me = j.me; auth.unlocked = j.unlocked; store.set('auth', auth);
  lastSync = j.serverTime; store.set('lastSync', lastSync);
  saveData();
}

let syncing = null;
function sync(full) {
  if (!auth) return Promise.resolve();
  if (syncing) return syncing;
  net.state = 'syncing'; renderStatus();
  syncing = (async () => {
    try {
      await flush();
      if (full || !D) await bootstrap();
      else {
        const j = await api('sync', { since: lastSync });
        D.trip = j.trip; D.members = j.members;
        j.records.forEach(applyServerRecord);
        lastSync = j.serverTime; store.set('lastSync', lastSync); saveData();
      }
      net = { state: 'idle', msg: '' };
    } catch (e) {
      net = e.code === 'NETWORK' ? { state: 'offline', msg: '' } : { state: 'error', msg: e.message };
    } finally {
      syncing = null; renderStatus();
      if (!F && !C && auth) render();
    }
  })();
  return syncing;
}

function queueSave(rec, baseRev, photoKey) {
  const i = outbox.findIndex(o => o.id === rec.id && o.type === 'save' && !o.inflight);
  if (i >= 0) {
    if (photoKey && outbox[i].photoKey) idb.del(outbox[i].photoKey);
    outbox[i].record = rec; if (photoKey) outbox[i].photoKey = photoKey;
  } else {
    const chain = outbox.some(o => o.id === rec.id);
    outbox.push({ opId: newId(), type: 'save', id: rec.id, record: rec, baseRev: chain ? null : baseRev, chain: chain, photoKey: photoKey || null });
  }
  saveOutbox();
}
function queueDelete(id) {
  const r = D.records[id];
  const pend = outbox.filter(o => o.id === id && !o.inflight);
  pend.forEach(o => { if (o.photoKey) idb.del(o.photoKey); });
  outbox = outbox.filter(o => !(o.id === id && !o.inflight));
  const onServer = (r && r.rev) || outbox.some(o => o.id === id);
  if (onServer) outbox.push({ opId: newId(), type: 'delete', id: id });
  delete D.records[id];
  saveOutbox(); saveData();
}

async function flush() {
  while (outbox.length) {
    const op = outbox[0];
    op.inflight = true;
    try {
      if (op.type === 'save') {
        if (op.chain) { op.baseRev = D.records[op.id] && D.records[op.id].rev || null; }
        if (op.photoKey) {
          const data = await idb.get(op.photoKey);
          if (data) { const p = await api('uploadPhoto', { data: data, mime: 'image/jpeg' }, 90000); op.record.photoId = p.photoId; }
          await idb.del(op.photoKey); op.photoKey = null; saveOutbox();
        }
        const rec = Object.assign({}, op.record); delete rec._pending; delete rec._err;
        const j = await api('saveRecord', { record: rec, baseRev: op.baseRev });
        if (j.conflict) {
          D.records[op.id] = j.record;
          toast('「' + (j.record.item || '這筆') + '」剛被 ' + (j.updatedByName || '別人') + ' 改過，已顯示最新版本，請確認後再修改', 5000);
        } else if (outbox.slice(1).some(o => o.id === op.id)) {
          // 同一筆後面還有修改在排隊：畫面保留最新的本機版本，只更新版本號
          D.records[op.id] = Object.assign({}, D.records[op.id], { rev: j.record.rev, photoId: j.record.photoId || D.records[op.id].photoId });
        } else D.records[op.id] = j.record;
      } else if (op.type === 'delete') {
        try { await api('deleteRecord', { id: op.id }); } catch (e) { if (e.code !== 'NOT_FOUND') throw e; }
      }
      outbox.shift(); saveOutbox(); saveData();
    } catch (e) {
      op.inflight = false; saveOutbox();
      if (RETRY[e.code] || e.code === 'AUTH' || !e.code) throw e;
      // 資料本身有問題：拿出佇列，在明細上標成「上傳失敗」讓使用者修正
      outbox.shift(); saveOutbox();
      if (e.code === 'DELETED') delete D.records[op.id];
      else if (D.records[op.id]) { D.records[op.id]._err = e.message; D.records[op.id]._pending = false; }
      saveData();
      toast('有一筆上傳失敗：' + e.message, 4500);
    }
  }
}

/* ===== 分帳、回饋計算（與後端相同規則） ===== */
function shares(r) {
  const amt = Math.round(num(r.amount));
  if (r.split === 'custom') { const o = {}; for (const k in r.custom) o[k] = num(r.custom[k]); return o; }
  let ids = r.split === 'all' ? active().map(m => m.id) : r.split === 'some' ? r.some : [r.payer];
  if (!ids || !ids.length) ids = [r.payer];
  const base = Math.floor(amt / ids.length), rem = amt - base * ids.length, o = {};
  ids.forEach(i => o[i] = base); o[ids.includes(r.payer) ? r.payer : ids[0]] += rem;
  return o;
}
function settle() {
  const bal = {}; D.members.forEach(m => bal[m.id] = { paid: 0, owe: 0 });
  recs().forEach(r => {
    const a = toBase(num(r.amount), r.currency);
    if (bal[r.payer]) bal[r.payer].paid += a;
    const sh = shares(r); for (const id in sh) if (bal[id]) bal[id].owe += toBase(sh[id], r.currency);
  });
  const shown = D.members.filter(m => m.active !== false || bal[m.id].paid || bal[m.id].owe);
  const L = shown.map(m => ({ id: m.id, net: Math.round(bal[m.id].paid - bal[m.id].owe) }));
  const cr = L.filter(x => x.net > 0).sort((a, b) => b.net - a.net), db = L.filter(x => x.net < 0).map(x => ({ id: x.id, net: -x.net })).sort((a, b) => b.net - a.net);
  const tr = []; let i = 0, j = 0;
  while (i < db.length && j < cr.length) { const v = Math.min(db[i].net, cr[j].net); if (v > 0) tr.push({ from: db[i].id, to: cr[j].id, v: v }); db[i].net -= v; cr[j].net -= v; if (db[i].net <= 0) i++; if (cr[j].net <= 0) j++; }
  return { bal: bal, tr: tr, shown: shown };
}
/* 卡片回饋：base＝基本回饋（無上限）；rules＝加碼規則（全部／類別／店家），rate 是含基本的總回饋，cap 是加碼可刷的台幣上限 */
const normT = t => String(t == null ? '' : t).toLowerCase().replace(/[\s・･·\-_]/g, '');
function ruleMatch(rule, r) {
  if (rule.kind === 'all') return true;
  if (rule.kind === 'cat') return rule.targets.includes(r.cat) || rule.targets.includes(r.sub) || rule.targets.includes(r.cat + '/' + r.sub);
  const text = normT((r.item || '') + ' ' + (r.note || ''));
  return rule.targets.some(k => { const n = normT(k); return n && text.includes(n); });
}
function bestRule(c, r, used) {
  let best = null;
  (c.rules || []).forEach(rule => {
    if (!ruleMatch(rule, r) || rule.rate <= c.base) return;
    const left = rule.cap == null ? Infinity : rule.cap - (used[rule.id] || 0);
    if (left <= 0) return;
    if (!best || rule.rate > best.rule.rate) best = { rule: rule, left: left };
  });
  return best;
}
function cardStat(c, exceptId) {
  const used = {}; (c.rules || []).forEach(r => used[r.id] = 0);
  let total = 0, reward = 0;
  recs().filter(r => r.pay === 'card' && r.cardId === c.id && r.id !== exceptId).sort((a, b) => sortKey(a) < sortKey(b) ? -1 : 1).forEach(r => {
    const t = toTWD(num(r.amount), r.currency); total += t; reward += t * c.base / 100;
    if (r.noBonus) return;
    const b = bestRule(c, r, used);
    if (b) { const x = Math.min(t, b.left); used[b.rule.id] += x; reward += x * (b.rule.rate - c.base) / 100; }
  });
  return { used: total, reward: reward, fee: total * c.fee / 100, ruleUsed: used };
}
// 預估「這筆刷這張卡」的回饋。probe 是一筆記帳（類別、項目、備註）
function quote(c, probe, amtTWD, exceptId) {
  const st = cardStat(c, exceptId), a = amtTWD > 0 ? amtTWD : 1000;
  const b = probe.noBonus ? null : bestRule(c, probe, st.ruleUsed);
  let rew = a * c.base / 100;
  if (b) rew += Math.min(a, b.left) * (b.rule.rate - c.base) / 100;
  const capped = probe.noBonus ? [] : (c.rules || []).filter(rule => rule.rate > c.base && rule.cap != null && ruleMatch(rule, probe) && rule.cap - (st.ruleUsed[rule.id] || 0) <= 0).map(x => x.name);
  const net = rew - a * c.fee / 100;
  return { c: c, rule: b && b.rule, left: b ? b.left : null, rate: rew / a * 100, net: net, netRate: net / a * 100, capped: capped };
}
function rankCards(owners, probe, amtTWD, exceptId) {
  return D.cards.filter(c => owners.includes(c.owner)).map(c => quote(c, probe, amtTWD, exceptId)).sort((x, y) => y.net - x.net);
}
const pct = n => (Math.round(n * 10) / 10) + '%';
function quoteLine(q, showOwner) {
  const why = q.rule ? `${esc(q.rule.name)} ${q.rule.rate}%${q.left !== Infinity && q.left != null ? `・加碼剩 ${fmt(q.left, 'TWD')}` : ''}` : `基本 ${q.c.base}%${q.capped.length ? `（${esc(q.capped.join('、'))} 額度已滿）` : ''}`;
  return `<span><b>${esc(q.c.name)}</b>${showOwner ? `<span class="rs">・${esc(member(q.c.owner).name)}</span>` : ''}<br><span class="rs">${why}</span>${q.rule && q.rule.note ? `<br><span class="rs">⚠ ${esc(q.rule.note)}</span>` : ''}</span>`;
}

async function doLogin(body, next) {
  L.busy = true; L.err = ''; renderLogin();
  try {
    const j = await api('login', body);
    L.busy = false;
    if (next) { next(j); return; }
    auth = { token: j.token, me: j.me, unlocked: j.unlocked }; store.set('auth', auth);
    if (D && D._owner && D._owner !== j.me) D = null;
    await bootstrap(); D._owner = auth.me; saveData();
    $('#login').hidden = true; L = { step: 'pass', pass: '', members: [], who: null, err: '', busy: false };
    tab = 'home'; render(); sync();
    toast(auth.unlocked ? '已解鎖管理員功能' : '歡迎，' + member(auth.me).name);
  } catch (e) {
    L.busy = false; L.err = e.code === 'NETWORK' ? '連不上伺服器，請確認網路後再試' : e.message; renderLogin();
  }
}

/* ===== 照片與收據辨識 ===== */
function compress(file, max, q) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight; const s = Math.min(1, (max || 1600) / Math.max(w, h));
      w = Math.round(w * s); h = Math.round(h * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q || 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('無法讀取這張照片')); };
    img.src = url;
  });
}
function applyOcr(o) {
  const c = D.categories.find(x => x.cat === o.cat);
  if (!F.amount && o.total) F.amount = String(Math.round(o.total));
  if (o.currency && /^[A-Z]{3}$/.test(o.currency)) F.currency = o.currency;
  if (c) { F.cat = c.cat; F.sub = c.subs.some(s => s.sub === o.sub) ? o.sub : (c.subs[0] || {}).sub; }
  if (!F.item && o.summary) F.item = o.summary.slice(0, 100);
  if (!F.note && (o.storeZh || o.store)) F.note = o.storeZh || o.store;
  if (o.date && /^\d{4}-\d{2}-\d{2}$/.test(o.date)) F.date = o.date;
  if (o.time && /^([01]\d|2[0-3]):[0-5]\d$/.test(o.time)) F.time = o.time;
  if (o.pay && o.pay !== 'unknown') F.pay = o.pay;
  F.ocr = true; F.ocrInfo = o; F.ocrState = 'done';
}
async function startOcr(file) {
  let data;
  try { data = await compress(file); } catch (e) { toast(e.message); return; }
  newForm({ photoData: data, ocrState: 'loading' });
  focusAmtSoon();
  const myF = F;
  try {
    const j = await api('ocr', { data: data.split(',')[1], mime: 'image/jpeg' }, 90000);
    if (F !== myF) return;
    F.photoId = j.photoId; F.photoData = null;
    if (j.result) applyOcr(j.result);
    else { F.ocrState = 'error'; F.ocrMsg = j.ocrError === 'OCR_RATE_LIMIT' ? '辨識次數暫時到上限，照片已保存，請手動填寫' : '這張收據辨識失敗，照片已保存，請手動填寫'; }
  } catch (e) {
    if (F !== myF) return;
    F.ocrState = 'error';
    F.ocrMsg = e.code === 'NETWORK' ? '目前沒有網路，無法辨識。照片會先存在手機，連上網路後自動上傳，請手動填寫' : '辨識失敗：' + e.message + '。照片會一起儲存，請手動填寫';
  }
  const y = $('#sheet').scrollTop; renderForm(); $('#sheet').scrollTop = y;
}
function focusAmtSoon() { /* 辨識期間不搶鍵盤，讓使用者先看照片 */ }
async function viewPhoto(id) {
  const v = $('#viewer'); v.hidden = false; v.innerHTML = '<span class="spin" style="color:#fff"></span>';
  try { const j = await api('getPhoto', { id: id }, 60000); v.innerHTML = `<img src="data:${esc(j.mime)};base64,${j.data}" alt="收據照片">`; }
  catch (e) { v.innerHTML = `<div class="alert">${e.code === 'NETWORK' ? '沒有網路，暫時看不到照片' : esc(e.message)}</div>`; }
}

    <div class="seg">${[['all', '全部消費'], ['cat', '指定類別'], ['store', '指定店家']].map(([k, l]) => `<button class="${r.kind === k ? 'on' : ''}" data-act="r-kind" data-v="${i}" data-k="${k}">${l}</button>`).join('')}</div>
    ${r.kind === 'cat' ? `<div class="chips">${cats.map(c => `<button class="chip sm ${r.targets.includes(c.cat) ? 'on' : ''}" data-act="r-cat" data-v="${i}" data-k="${esc(c.cat)}">${c.icon} ${esc(c.cat)}</button>`).join('')}</div>` : ''}
    ${r.kind === 'store' ? `<textarea class="inp" id="r${i}_targets" rows="3" placeholder="店家關鍵字，用頓號分隔，例如 唐吉訶德、Don Quijote、驚安殿堂">${esc(r.targets.join('、'))}</textarea>` : ''}
    <div class="row2"><div class="field"><label class="note" for="r${i}_rate">總回饋 %（含基本）</label><input class="inp num" id="r${i}_rate" inputmode="decimal" value="${esc(r.rate)}"></div>
    <div class="field"><label class="note" for="r${i}_cap">加碼上限（可刷台幣，空白＝無上限）</label><input class="inp num" id="r${i}_cap" inputmode="numeric" value="${esc(r.cap)}"></div></div>
    <input class="inp" id="r${i}_note" placeholder="條件備註，例如 需登錄、單筆滿 1,000" value="${esc(r.note)}"></div>`;
  $('#sheet').innerHTML = `<div class="sh-in">
  <div class="sh-top"><button class="link" data-act="cancel">取消</button><h2>${C.id ? '編輯卡片' : '新增卡片'}</h2><span style="width:40px"></span></div>
  ${f('cName', '卡片名稱', C.name, '', '例如：玉山 熊本熊')}
  <div class="field"><h3 class="h" style="margin:0">持卡人</h3><div class="chips">${owners.map(m => `<button class="chip ${C.owner === m.id ? 'on' : ''}" data-act="c-owner" data-v="${m.id}">${esc(m.name)}</button>`).join('')}</div></div>
  <div class="row2">${f('cBase', '基本回饋 %（無上限）', C.base, 'decimal', '2.5')}${f('cFee', '海外手續費 %', C.fee, 'decimal', '1.5')}</div>
  <div class="field"><h3 class="h" style="margin:0">加碼規則</h3><div class="note">每筆消費會自動套用最划算、而且還有額度的規則；超過上限就回到基本回饋。店家是用「項目＋備註」裡的文字比對。</div>
  ${C.rules.map(rule).join('')}<button class="btn ghost" data-act="r-add">＋ 新增加碼規則</button></div>
  ${f('cNote', '卡片備註（選填）', C.note, '', '例如：需切換方案、帳戶自扣')}
  ${C.id ? (C.confirmDel ? `<div class="panel"><b>確定刪除這張卡？</b><div class="row2"><button class="btn danger" data-act="c-del-yes">刪除</button><button class="btn ghost" data-act="c-del-no">保留</button></div></div>`
    : '<button class="btn ghost" style="color:var(--seal)" data-act="c-del">刪除這張卡</button>') : ''}
  <div class="sh-foot"><div class="hint">${esc(C.err)}</div><button class="btn" data-act="c-save" ${C.saving ? 'disabled' : ''}>${C.saving ? '<span class="spin"></span> 儲存中' : '儲存卡片'}</button></div></div>`;
}
function readCardInputs() {
  if (C.mode !== 'card') return;
  const v = id => { const el = $('#' + id); return el ? el.value : null; };
  [['name', 'cName'], ['base', 'cBase'], ['fee', 'cFee'], ['note', 'cNote']].forEach(([k, id]) => { const x = v(id); if (x != null) C[k] = x; });
  C.rules.forEach((r, i) => {
    ['name', 'rate', 'cap', 'note'].forEach(k => { const x = v('r' + i + '_' + k); if (x != null) r[k] = x; });
    const t = v('r' + i + '_targets'); if (t != null) r.targets = t.split(/[、,，\n]+/).map(s => s.trim()).filter(Boolean);
  });
}
function cardPayload() {
  return { id: C.id || undefined, owner: C.owner, name: C.name.trim(), base: num(C.base), fee: num(C.fee), note: C.note,
    rules: C.rules.map(r => ({ name: r.name.trim() || '加碼', kind: r.kind, targets: r.kind === 'all' ? [] : r.targets, rate: num(r.rate), cap: String(r.cap).trim() === '' ? null : num(r.cap), note: r.note })) };
}
async function saveCardNow() {
  readCardInputs();
  if (!C.name.trim()) { C.err = '請輸入卡片名稱'; renderCard(); return; }
  const bad = C.rules.findIndex(r => !(num(r.rate) > 0) || (r.kind !== 'all' && !r.targets.length));
  if (bad >= 0) { C.err = `第 ${bad + 1} 條規則還沒填完整（回饋%，或類別／店家）`; renderCard(); return; }
  C.saving = true; C.err = ''; renderCard();
  try {
    const j = await api('saveCard', { card: cardPayload() });
    const i = D.cards.findIndex(c => c.id === j.card.id); if (i >= 0) D.cards[i] = j.card; else D.cards.push(j.card);
    saveData(); closeSheet(); toast('卡片已儲存');
  } catch (e) { C.saving = false; C.err = e.code === 'NETWORK' ? '需要網路才能儲存卡片' : e.message; renderCard(); }
}

/* ===== 匯入建議卡片 ===== */
function openImport() {
  const admins = D.members.filter(m => m.admin);
  const map = {}; PRESET.owners.forEach((o, i) => { const m = admins.find(a => a.name === o.name) || admins[i] || admins[0]; map[o.key] = m ? m.id : ''; });
  const have = c => D.cards.some(x => x.owner === map[c.owner] && x.name === c.name);
  C = { mode: 'import', map: map, pick: PRESET.cards.map(c => !have(c)), saving: false, err: '' };
  $('#sheet').hidden = false; document.body.style.overflow = 'hidden'; renderImport(); $('#sheet').scrollTop = 0;
}
function renderImport() {
  const admins = D.members.filter(m => m.admin);
  const have = c => D.cards.some(x => x.owner === C.map[c.owner] && x.name === c.name);
  $('#sheet').innerHTML = `<div class="sh-in">
  <div class="sh-top"><button class="link" data-act="cancel">取消</button><h2>匯入建議卡片</h2><span style="width:40px"></span></div>
  <div class="info">依 ${esc(PRESET.version)} 整理的日本回饋規則。匯入後可以在「卡片」頁逐張修改。已經有同名卡片的會自動跳過。</div>
  ${PRESET.owners.map(o => `<div class="field"><h3 class="h" style="margin:0">「${esc(o.name)}」的卡要給</h3><div class="chips">${admins.map(m => `<button class="chip sm ${C.map[o.key] === m.id ? 'on' : ''}" data-act="imp-owner" data-v="${o.key}" data-k="${m.id}">${esc(m.name)}</button>`).join('')}</div></div>`).join('')}
  ${PRESET.owners.map(o => `<section class="list">${PRESET.cards.map((c, i) => c.owner !== o.key ? '' : `<label class="row" style="grid-template-columns:28px minmax(0,1fr)"><input type="checkbox" id="imp${i}" ${C.pick[i] ? 'checked' : ''} ${have(c) ? 'disabled' : ''} style="width:20px;height:20px">
    <span class="rmid"><span class="rt">${esc(c.name)}${have(c) ? '<em class="tag">已有</em>' : ''}</span><span class="rs">基本 ${c.base}%${c.rules.map(r => `・${esc(r.name)} ${r.rate}%`).join('')}</span></span></label>`).join('')}</section>`).join('')}
  <div class="sh-foot"><div class="hint">${esc(C.err)}</div><button class="btn" data-act="imp-go" ${C.saving ? 'disabled' : ''}>${C.saving ? '<span class="spin"></span> 匯入中，約 20 秒' : '匯入勾選的卡片'}</button></div></div>`;
}
async function doImport() {
  PRESET.cards.forEach((c, i) => { const el = $('#imp' + i); if (el) C.pick[i] = el.checked && !el.disabled; });
  const cards = PRESET.cards.filter((c, i) => C.pick[i]).map((c, i) => Object.assign({}, c, { owner: C.map[c.owner], order: D.cards.length + i + 1 }));
  if (!cards.length) { C.err = '沒有勾選卡片'; renderImport(); return; }
  C.saving = true; C.err = ''; renderImport();
  try { const j = await api('importCards', { cards: cards }, 120000); D.cards = D.cards.concat(j.cards); saveData(); closeSheet(); toast(`已匯入 ${j.cards.length} 張卡`); }
  catch (e) { C.saving = false; C.err = e.code === 'NETWORK' ? '需要網路才能匯入' : e.message; renderImport(); }
}

/* ===== 事件 ===== */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  switch (a) {
    case 'tab': tab = v; listFilter = b.dataset.f || (b.closest('.tabs') ? listFilter : 'all'); render(); window.scrollTo(0, 0); break;
    case 'filter': listFilter = v; render(); break;
    case 'sync-now': sync(true); break;
    case 'new': newForm(); focusAmt(); break;
    case 'ocr': $('#ocrFile').click(); break;
    case 'tpl': { const t = D.templates[+v]; const c = D.categories.find(x => x.cat === t.cat);
      newForm({ cat: c ? c.cat : F && F.cat, sub: c && c.subs.some(s => s.sub === t.sub) ? t.sub : c && c.subs[0] ? c.subs[0].sub : '', item: t.item || '' }); focusAmt(); break; }
    case 'edit': editRec(v); break;
    case 'cancel': closeSheet(); break;
    case 'f-set': F[b.dataset.k] = v;
      if (b.dataset.k === 'payer' && F.cardId && !D.cards.find(c => c.id === F.cardId && c.owner === v)) F.cardId = '';
      renderForm(); break;
    case 'f-cat': F.cat = v; F.sub = (cat(v).subs[0] || {}).sub || ''; if (v === '未分類') F.item = ''; renderForm(); break;
    case 'f-sub': F.sub = v; renderForm(); break;
    case 'f-item': F.item = F.item === v ? '' : v; renderForm(); break;
    case 'f-card': F.cardId = v; renderForm(); break;
    case 'f-mem': F.some = F.some.includes(v) ? F.some.filter(x => x !== v) : F.some.concat(v); renderForm(); break;
    case 'f-cu':
      if (F.customSel.includes(v)) { F.customSel = F.customSel.filter(x => x !== v); delete F.custom[v]; } else F.customSel.push(v);
      renderForm(); if (F.customSel.includes(v)) { const i = $('#cu_' + v); if (i) i.focus(); } break;
    case 'f-rest': { const d = Math.round(num(F.amount) - customSum()); if (!d) break;
      if (v === 'payer') { if (!F.customSel.includes(F.payer)) F.customSel.push(F.payer); F.custom[F.payer] = num(F.custom[F.payer]) + d; }
      else { const ids = F.customSel.slice(); const base = Math.floor(d / ids.length); const rem = d - base * ids.length;
        ids.forEach(i => F.custom[i] = num(F.custom[i]) + base); F.custom[ids.includes(F.payer) ? F.payer : ids[0]] += rem; }
      renderForm(); break; }
    case 'f-photo': $('#photoFile').click(); break;
    case 'view-photo': viewPhoto(v); break;
    case 'close-viewer': $('#viewer').hidden = true; $('#viewer').innerHTML = ''; break;
    case 'save': doSave(); break;
    case 'del': F.confirmDel = true; renderForm(); break;
    case 'del-no': F.confirmDel = false; renderForm(); break;
    case 'del-yes': queueDelete(F.id); closeSheet(); toast('已刪除'); sync(); break;
    case 'shop-pick': shop.text = shop.text === v ? '' : v; render(); break;
    case 'shop-cat': shop.cat = shop.cat === v ? '' : v; render(); break;
    case 'shop-who': shop.who = v; render(); break;
    case 'preset-open': openImport(); break;
    case 'imp-owner': PRESET.cards.forEach((c, i) => { const el = $('#imp' + i); if (el) C.pick[i] = el.checked; }); C.map[v] = b.dataset.k; renderImport(); break;
    case 'imp-go': doImport(); break;
    case 'card-new': cardForm({ owner: v }); break;
    case 'card-edit': { const c = D.cards.find(x => x.id === v); if (c) cardForm({ id: c.id, owner: c.owner, name: c.name, base: String(c.base), fee: String(c.fee), note: c.note || '', rules: c.rules || [] }); break; }
    case 'c-owner': readCardInputs(); C.owner = v; renderCard(); break;
    case 'r-add': readCardInputs(); C.rules.push({ name: '', kind: 'store', targets: [], rate: '', cap: '', note: '' }); renderCard(); break;
    case 'r-del': readCardInputs(); C.rules.splice(+v, 1); renderCard(); break;
    case 'r-kind': readCardInputs(); C.rules[+v].kind = b.dataset.k; if (b.dataset.k !== 'store') C.rules[+v].targets = C.rules[+v].targets.filter(t => D.categories.some(c => c.cat === t)); renderCard(); break;
    case 'r-cat': { readCardInputs(); const r = C.rules[+v], k = b.dataset.k; r.targets = r.targets.includes(k) ? r.targets.filter(x => x !== k) : r.targets.concat(k); renderCard(); break; }
    case 'c-save': saveCardNow(); break;
    case 'c-del': readCardInputs(); C.confirmDel = true; renderCard(); break;
    case 'c-del-no': C.confirmDel = false; renderCard(); break;
    case 'c-del-yes': try { await api('deleteCard', { id: C.id }); D.cards = D.cards.filter(c => c.id !== C.id); saveData(); closeSheet(); toast('已刪除卡片'); }
      catch (err) { C.confirmDel = false; C.err = err.code === 'NETWORK' ? '需要網路才能刪除' : err.message; renderCard(); } break;
    case 'save-trip': { const name = $('#setName').value.trim(), cur = $('#setCur').value.trim().toUpperCase(), rate = num($('#setRate').value);
      if (!(rate > 0)) { toast('匯率要大於 0'); break; } if (!/^[A-Z]{3}$/.test(cur)) { toast('幣別請用 3 個英文字母，例如 JPY'); break; }
      busy.trip = true; render();
      try { const j = await api('setTrip', { name: name, currency: cur, rate: rate }); D.trip = j.trip; saveData(); toast('旅程設定已更新'); }
      catch (err) { toast(err.code === 'NETWORK' ? '需要網路才能修改' : err.message); }
      busy.trip = false; render(); break; }
    case 'add-mem': { const n = $('#newMem').value.trim(); if (!n) break; busy.mem = true; render();
      try { const j = await api('addMember', { name: n }); const i = D.members.findIndex(m => m.id === j.member.id); if (i >= 0) D.members[i] = j.member; else D.members.push(j.member); saveData(); toast('已新增 ' + n); }
      catch (err) { toast(err.code === 'NETWORK' ? '需要網路才能新增團員' : err.message); }
      busy.mem = false; render(); break; }
    case 'mem-del': memDel = v; render(); break;
    case 'mem-del-no': memDel = null; render(); break;
    case 'mem-del-yes': { const n = member(v).name; memDel = null;
      try { await api('removeMember', { id: v }); const m = D.members.find(x => x.id === v); if (m) m.active = false; saveData(); toast('已刪除 ' + n); }
      catch (err) { toast(err.code === 'NETWORK' ? '需要網路才能刪除團員' : err.message); }
      render(); break; }
    case 'export': busy.exp = true; exportRes = null; render();
      try { exportRes = await api('exportXlsx', {}, 180000); toast('匯出完成'); } catch (err) { toast(err.code === 'NETWORK' ? '需要網路才能匯出' : err.message, 4000); }
      busy.exp = false; render(); break;
    case 'logout': if (outbox.length) break; auth = null; store.del('auth'); D = null; store.del('data'); store.del('lastSync'); lastSync = 0;
      L = { step: 'pass', pass: '', members: [], who: null, err: '', busy: false }; showLogin(); break;
    case 'login-pass': L.pass = $('#pc').value.trim(); if (!L.pass) break;
      doLogin({ pass: L.pass }, j => { L.members = j.members; L.step = 'who'; renderLogin(); }); break;
    case 'login-who': { const m = L.members.find(x => x.id === v);
      if (m && m.admin) { L.who = v; L.step = 'pin'; L.err = ''; renderLogin(); const p = $('#pinIn'); if (p) p.focus(); }
      else doLogin({ pass: L.pass, memberId: v }); break; }
    case 'login-pin': doLogin({ pass: L.pass, memberId: L.who, pin: $('#pinIn').value.trim() }); break;
    case 'login-skip': doLogin({ pass: L.pass, memberId: L.who }); break;
    case 'login-back': L = { step: 'pass', pass: '', members: [], who: null, err: '', busy: false }; renderLogin(); break;
    case 'login-back-who': L.step = 'who'; L.err = ''; renderLogin(); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (F) {
    if (t.id === 'amt') { const c = t.value.replace(/[^\d.]/g, ''); if (c !== t.value) t.value = c; F.amount = c; updLive(); }
    else if (t.id === 'item') F.item = t.value;
    else if (t.id === 'note') F.note = t.value;
    else if (t.id === 'date') F.date = t.value;
    else if (t.dataset.cu) { const c = t.value.replace(/[^\d.]/g, ''); if (c !== t.value) t.value = c; F.custom[t.dataset.cu] = c; updLive(); }
  }
  if (t.id === 'shopText') { shop.text = t.value; updShop(); }
  if (t.id === 'shopAmt') { shop.amt = t.value.replace(/[^\d.]/g, ''); updShop(); }
  if (F && (t.id === 'item' || t.id === 'note')) updLive();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (!F) return;
  if (t.id === 'noBonus') { F.noBonus = t.checked; $('#noBonusL').classList.toggle('on', t.checked); updLive(); }
  if (t.id === 'unc') { F.uncertain = t.checked; $('#uncL').classList.toggle('on', t.checked); updLive(); }
  if (t.id === 'hh' || t.id === 'mm') F.time = $('#hh').value + ':' + $('#mm').value;
  if (t.id === 'noTime') { F.time = t.checked ? '' : nowHM(); const y = $('#sheet').scrollTop; renderForm(); $('#sheet').scrollTop = y; }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'pc') $('[data-act="login-pass"]').click();
  if (e.target.id === 'pinIn') $('[data-act="login-pin"]').click();
  if (e.target.id === 'amt') e.target.blur();
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });
window.addEventListener('online', () => sync());
window.addEventListener('offline', () => { net = { state: 'offline', msg: '' }; renderStatus(); });
setInterval(() => { if (document.visibilityState === 'visible' && !F && !C) sync(); }, SYNC_MS);

/* ===== 啟動 ===== */
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (auth && D) { render(); sync(true); }   // 每次打開 App 都完整載入一次，Sheet 上改的類別、模板、清空的資料才會套用
else if (auth) { $('#login').hidden = false; $('#login').innerHTML = '<div class="login-in"><div class="brand">旅途記帳本</div><div class="note"><span class="spin"></span> 載入中…</div></div>';
  sync(true).then(() => { if (D) { $('#login').hidden = true; render(); } else if (auth) { $('#login').innerHTML = '<div class="login-in"><div class="brand">旅途記帳本</div><div class="alert">第一次開啟需要網路，請連上網路後重新整理</div></div>'; } }); }
else showLogin();
</script>
</body>
</html>
